    <!-- Favicons / app icons. SVG for desktop browsers that support it,
         PNG fallback for those that don't, and a 180×180 apple-touch-icon
         so iOS "Add to Home Screen" picks a sharp, full-bleed image. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- iOS standalone web-app hints. With these + the manifest below, the
         home-screen launch opens in a full-screen WebView with stable,
         non-evicted storage (rather than a transient Safari shortcut). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="资治通鉴" />
    <meta name="theme-color" content="#7a3b2e" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" />
