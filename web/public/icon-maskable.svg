<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: same look, but the 鑑 sits inside the 80% safe zone
       (icon may be cropped to a circle / squircle by the OS). -->
  <rect width="512" height="512" fill="#7a3b2e"/>
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif"
        font-weight="700"
        font-size="260"
        fill="#f4ecd8">鑑</text>
</svg>
