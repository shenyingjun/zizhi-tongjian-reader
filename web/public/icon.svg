<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid square background — iOS rounds it; Android maskable handles safe area separately. -->
  <rect width="512" height="512" fill="#7a3b2e"/>
  <!-- Thin inset border, like a 印章 frame. -->
  <rect x="40" y="40" width="432" height="432" fill="none" stroke="#f4ecd8" stroke-width="6" stroke-opacity="0.55"/>
  <!-- Single character 鑑 in a serif face, centered. -->
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif"
        font-weight="700"
        font-size="340"
        fill="#f4ecd8">鑑</text>
</svg>
