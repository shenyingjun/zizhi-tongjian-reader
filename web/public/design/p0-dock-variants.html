<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案② 工具坞 · 无标签 3 变体</title>
<style>
  :root{
    --bg:#f3e9cf;--paper:#fbf4df;--surface:#fff;--ink:#2b2118;--muted:#7a6a4f;
    --accent:#7a3b2e;--accent-pressed:#5c2a20;--hu:#8a5a3a;--border:#e0cfa0;--line:rgba(122,59,46,.14);--tint:rgba(122,59,46,.08);
    --radius:9px;--shadow:0 18px 44px rgba(43,33,24,.20);
    --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 80% at 50% -10%,#f7eed4,var(--bg));-webkit-font-smoothing:antialiased;}
  .topbar{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.7rem 1.2rem;background:rgba(247,238,212,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar h1{font-size:.96rem;margin:0;font-weight:800;letter-spacing:-.01em;}
  .topbar h1 small{font-weight:500;color:var(--muted);margin-left:.4rem;font-size:.76rem;}
  .tabs{display:flex;gap:.3rem;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted);background:#efe2bf;border:1px solid var(--border);border-radius:999px;padding:.34em .8em;display:flex;align-items:center;gap:.4em;transition:all 160ms cubic-bezier(.22,1,.36,1);}
  .tabs button .n{font-variant-numeric:tabular-nums;opacity:.6;font-weight:800;}
  .tabs button[aria-pressed="true"]{background:var(--accent);color:#fdf6e6;border-color:var(--accent);box-shadow:0 2px 8px rgba(92,42,32,.3);}
  .tabs button:not([aria-pressed="true"]):hover{color:var(--accent);border-color:#d8b8a8;}
  .rec-dot{width:6px;height:6px;border-radius:50%;background:#2f8f5b;box-shadow:0 0 0 2px rgba(47,143,91,.25);}
  .view-toggle{margin-left:auto;display:inline-flex;background:#efe2bf;border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .view-toggle button{font:inherit;font-size:.78rem;font-weight:600;border:0;background:transparent;color:var(--muted);padding:.3em .8em;border-radius:999px;cursor:pointer;}
  .view-toggle button[aria-pressed="true"]{background:var(--accent);color:#fdf6e6;}

  .spec{max-width:1240px;margin:0 auto;padding:.9rem 1.2rem .2rem;}
  .spec-name{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:.5rem;}
  .spec-badge{font-size:.66rem;font-weight:700;color:#2f8f5b;background:rgba(47,143,91,.12);border:1px solid rgba(47,143,91,.35);border-radius:999px;padding:.1em .55em;}
  .spec-thesis{color:#4a3c2a;font-size:.87rem;margin:.25rem 0 .6rem;max-width:84ch;line-height:1.5;}
  .spec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;}
  .spec-cell{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:.5rem .65rem;}
  .spec-cell .k{font-size:.66rem;font-weight:700;color:var(--accent);margin-bottom:.2rem;}
  .spec-cell .v{font-size:.78rem;color:var(--ink);line-height:1.45;}
  .spec-cell.risk .k{color:#b06a28;}

  .stage-wrap{padding:1.1rem 1.2rem 2.4rem;display:flex;justify-content:center;}
  .hint-float{text-align:center;font-size:.76rem;color:var(--muted);padding:.2rem 0 .6rem;}
  .hint-float b{color:var(--accent);}

  .device-desktop{width:min(1140px,96vw);aspect-ratio:16/10;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative;}
  .device-desktop .chrome{height:26px;background:#efe6cd;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;}
  .device-desktop .chrome i{width:9px;height:9px;border-radius:50%;background:#cdbf98;display:inline-block;}
  .device-desktop .screen{position:absolute;top:26px;left:0;right:0;bottom:0;}
  .device-phone{width:380px;max-width:94vw;aspect-ratio:380/760;background:#1c160f;border-radius:34px;padding:11px;box-shadow:var(--shadow);}
  .device-phone .screen{width:100%;height:100%;background:var(--bg);border-radius:24px;overflow:hidden;position:relative;}

  .app{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 360px;grid-template-areas:'hdr hdr' 'rd dock';background:var(--bg);overflow:hidden;}
  .hdr{grid-area:hdr;display:flex;align-items:center;gap:.6rem;padding:.45rem .75rem;background:rgba(251,244,223,.9);border-bottom:1px solid var(--border);z-index:5;}
  .hdr .ico{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fffdf6;color:var(--muted);display:grid;place-items:center;font-size:.8rem;cursor:pointer;}
  .hdr .ico:hover{color:var(--accent);border-color:#d8b8a8;}
  .hdr .ttl{font-family:var(--serif);font-weight:700;font-size:.92rem;color:var(--accent);}
  .hdr .grow{flex:1;}

  .reader{grid-area:rd;overflow:auto;position:relative;}
  .reader-inner{margin:0 auto;max-width:640px;padding:1.1rem 1.2rem 2rem;}
  .reader h2{font-family:var(--serif);font-size:.98rem;margin:0 0 .15rem;color:var(--accent);}
  .reader .sub{font-size:.7rem;color:var(--muted);margin-bottom:.9rem;}
  .para{font-family:var(--serif);font-size:1rem;line-height:1.95;text-align:justify;margin:0 0 1rem;color:var(--ink);}
  .pname{font:inherit;background:transparent;border:0;padding:0 1px;cursor:pointer;color:inherit;border-radius:2px;box-shadow:inset 0 -2px 0 rgba(122,59,46,.45);transition:background 140ms,box-shadow 140ms;}
  .pname:hover{background:rgba(122,59,46,.1);}
  .pname.on{background:rgba(122,59,46,.16);box-shadow:inset 0 -2px 0 var(--accent);}

  .dock{grid-area:dock;background:var(--paper);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .dock-body{flex:1;overflow:auto;}
  .sec{padding:.6rem .75rem;border-bottom:1px solid var(--line);}
  .sec:last-child{border-bottom:0;}

  /* year strip */
  .yr-strip{display:flex;flex-direction:column;gap:.3rem;padding:.5rem .75rem;background:rgba(251,244,223,.96);border-bottom:1px solid var(--border);}
  .yr-strip .lead{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--accent);font-weight:700;}
  .yr-strip .lead .y{font-variant-numeric:tabular-nums;}
  .yr-strip .lead .lbl{color:var(--muted);font-weight:500;}
  .mini-rail{position:relative;height:2px;background:color-mix(in srgb,var(--border) 80%,transparent);margin:.25rem .1rem .15rem;}
  .mini-rail .t{position:absolute;top:-3px;width:1px;height:8px;background:#caa;transform:translateX(-50%);cursor:pointer;}
  .mini-rail .b{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(122,59,46,.2);}

  .ctx-head{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;border-bottom:1px solid var(--line);background:rgba(122,59,46,.04);}
  .ctx-head .t{font-size:.82rem;font-weight:700;color:var(--accent);}
  .ctx-head .t small{color:var(--muted);font-weight:500;}
  .ctx-head .grow{flex:1;}
  .back{font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--accent);background:var(--tint);border:1px solid var(--border);border-radius:7px;padding:.26em .55em;}
  .back:hover{background:rgba(122,59,46,.13);}

  .panel-title{font-size:.74rem;font-weight:700;color:var(--accent);margin:0 0 .5rem;}
  .yrow{display:flex;gap:.5rem;font-size:.78rem;padding:.24em 0;color:var(--muted);cursor:pointer;}
  .yrow b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .yrow.cur{color:var(--accent);font-weight:700;}
  .yrow:hover{color:var(--accent);}
  .sinput{width:100%;font:inherit;font-size:.8rem;padding:.4em .55em;border:1px solid var(--border);border-radius:7px;background:#fffdf6;color:var(--ink);}
  .filt{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.35rem;margin-top:.45rem;}

  .mast{display:flex;align-items:flex-start;gap:.45rem;margin-bottom:.4rem;}
  .mast h4{font-family:var(--serif);font-size:.98rem;font-weight:700;margin:0;}
  .mast .src{font-size:.6rem;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:.04em .4em;align-self:center;}
  .mast .x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;line-height:1;}
  .mast .x:hover{color:var(--accent);}
  .brief{font-size:.78rem;color:#4a3c2a;margin:.1rem 0 .45rem;}
  .meta{display:flex;gap:.35rem;flex-wrap:wrap;font-size:.7rem;margin-bottom:.45rem;}
  .meta .c{border:1px solid var(--border);border-radius:999px;padding:.04em .45em;color:var(--muted);}
  .meta .c.cf{color:var(--accent);border-color:#d8b8a8;background:var(--tint);}
  .tlh{display:flex;align-items:center;gap:.35rem;font-size:.74rem;color:var(--muted);padding-top:.4rem;border-top:1px solid var(--line);margin-bottom:.45rem;}
  .tlh b{color:var(--ink);}
  .chips{display:flex;flex-wrap:wrap;gap:.32rem;}
  .jchip{font:inherit;font-size:.72rem;cursor:pointer;display:inline-flex;align-items:center;gap:.28em;background:#fffdf6;border:1px solid var(--border);border-radius:999px;padding:.2em .55em;color:var(--ink);transition:all 130ms;}
  .jchip .y{font-variant-numeric:tabular-nums;font-weight:600;}
  .jchip .s{color:var(--muted);font-size:.92em;}.jchip .s.hu{color:var(--hu);}
  .jchip .a{color:var(--accent);font-weight:700;}
  .jchip:hover{background:#f0e4c4;border-color:#d8b8a8;}
  .reveal{margin-top:.55rem;width:100%;text-align:left;font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;background:var(--tint);border:1px dashed #cdab9a;border-radius:7px;padding:.42em .55em;color:var(--accent);}
  .reveal:hover{background:rgba(122,59,46,.13);}
  .future{margin-top:.5rem;padding-top:.45rem;border-top:1px solid var(--line);}
  .future h5{margin:0 0 .35rem;font-size:.72rem;color:var(--accent);}
  .future .jchip{background:rgba(176,110,40,.08);border-color:#d9bd8a;}
  .future .jchip .y{color:#8a5a1a;}
  .empty{color:var(--muted);font-size:.76rem;text-align:center;padding:1.2rem .5rem;line-height:1.6;}

  /* spotlight + peeks */
  .spotlight{flex:1;overflow:auto;padding:.7rem .75rem;}
  .peeks{border-top:1px solid var(--border);}
  .peek{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;font:inherit;cursor:pointer;background:transparent;border:0;border-top:1px solid var(--line);padding:.6rem .8rem;}
  .peek:first-child{border-top:0;}
  .peek:hover{background:var(--tint);}
  .peek .pk-t{font-size:.78rem;font-weight:700;color:var(--accent);}
  .peek .pk-s{font-size:.72rem;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}

  /* real-app search-result styling (mirrored from styles.css .lookup-*) */
  .yr-strip-btn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);cursor:pointer;}
  .yr-strip-btn .strip-arrow{font-size:.7rem;color:var(--accent);background:var(--tint);border:1px solid #d8b8a8;border-radius:999px;padding:.1em .55em;white-space:nowrap;}
  .yr-strip-btn:hover{background:rgba(122,59,46,.05);}
  .lookup-juan-group{border:1px solid var(--border);border-radius:6px;background:#f8f0d8;padding:.4rem .5rem;}
  .lookup-juan-group.is-current{border-color:var(--accent);background:#f1e1c0;}
  .lookup-juan-group.is-future{border-color:#d9bd8a;background:rgba(176,110,40,.07);}
  .lookup-juan-header{display:flex;align-items:center;gap:.5rem;border-bottom:1px solid rgba(122,59,46,.25);padding-bottom:.25rem;margin-bottom:.3rem;}
  .lookup-juan-label{font-weight:700;color:var(--accent);font-size:.84rem;}
  .lookup-juan-group.is-current .lookup-juan-label::after{content:'· 本卷';margin-left:.4em;font-weight:400;font-size:.72rem;}
  .lookup-juan-group.is-future .lookup-juan-label::after{content:'· 后文';margin-left:.4em;font-weight:400;font-size:.72rem;color:#8a5a1a;}
  .lookup-juan-count{color:var(--muted);font-size:.73rem;margin-left:auto;font-variant-numeric:tabular-nums;}
  .hit-nav{display:inline-flex;align-items:center;gap:.05rem;border:1px solid rgba(122,59,46,.25);border-radius:999px;background:rgba(253,246,227,.7);padding:1px;}
  .hit-nav-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:transparent;border:0;cursor:pointer;color:var(--accent);border-radius:999px;font-size:.62rem;line-height:1;}
  .hit-nav-btn:hover{background:var(--accent);color:#fdf6e6;}
  .hit-nav-count{font-variant-numeric:tabular-nums;padding:0 .3rem;font-size:.72rem;color:var(--accent);font-weight:600;}
  .hit-nav-sep{color:var(--muted);margin:0 .05em;font-weight:400;}
  .lookup-year-group{margin-top:.2rem;}
  .lookup-year-header{font-size:.73rem;color:var(--muted);padding:.1rem .3rem;font-variant-numeric:tabular-nums;}
  .lookup-list{list-style:none;padding:0;margin:0;}
  .lookup-hit{margin-bottom:.3rem;}.lookup-hit:last-child{margin-bottom:0;}
  .lookup-jump{display:block;width:100%;text-align:left;background:#fffdf6;border:1px solid rgba(122,59,46,.22);border-radius:7px;padding:.34rem .5rem;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(43,33,24,.06);transition:background .12s,border-color .12s;}
  .lookup-jump:hover{background:#f4dca0;border-color:var(--accent);}
  .lookup-snippet{display:block;font-size:.84rem;line-height:1.55;color:var(--ink);font-family:var(--serif);}
  .lookup-snippet mark{background:#f4d089;color:var(--ink);padding:0 .1em;border-radius:2px;font-weight:600;}
  .lookup-snippet.in-hu{color:var(--hu);font-size:.8rem;font-style:italic;}
  .lookup-snippet.in-hu::before{content:'胡注 · ';font-style:normal;font-size:.71rem;opacity:.75;margin-right:.15em;}

  /* phone */
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);}
  .ph-hdr{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;background:rgba(251,244,223,.95);border-bottom:1px solid var(--border);}
  .ph-hdr .ico{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fffdf6;color:var(--muted);display:grid;place-items:center;font-size:.72rem;}
  .ph-hdr .ttl{font-family:var(--serif);font-weight:700;font-size:.8rem;color:var(--accent);flex:1;}
  .ph-hdr .pill{font-size:.66rem;color:var(--accent);background:var(--tint);border:1px solid #d8b8a8;border-radius:999px;padding:.12em .5em;font-variant-numeric:tabular-nums;}
  .ph-rd{flex:1;overflow:auto;padding:.8rem .85rem;}
  .ph-rd .para{font-size:.92rem;}
  .ph-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(43,33,24,.18);display:flex;flex-direction:column;max-height:74%;}
  .ph-grip{width:38px;height:4px;border-radius:999px;background:#cdbf98;margin:.5rem auto .2rem;}
  .ph-sheet-body{overflow:auto;padding:.2rem .8rem .9rem;}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--accent);color:#fdf6e6;font-size:.8rem;font-weight:600;padding:.5em .9em;border-radius:999px;opacity:0;pointer-events:none;transition:all 180ms cubic-bezier(.22,1,.36,1);z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .swap-in{animation:swap 170ms cubic-bezier(.22,1,.36,1);}
  @keyframes swap{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (max-width:980px){.spec-grid{grid-template-columns:1fr;}}
</style>
</head>

  <div class="topbar">
    <h1>方案② 工具坞<small>无标签 · 3 个变体</small></h1>
    <div class="tabs" id="vtabs">

  <div class="spec" id="spec"></div>
  <div class="hint-float">三者都：阅读 + 常驻右坞 · <b>无标签页</b> · 人物与检索共用同一「跳转芯片」出处列表。点正文 <b>「王翦」</b> 或点 <b>⌕</b> 检索体验。</div>
  <div class="stage-wrap" id="stage"></div>
  <div class="toast" id="toast"></div>

<script>
  const SPEC={
    swap:{name:"A · 上下文聚焦 Contextual Focus",rec:true,
      thesis:"右坞一次只聚焦一件事，由你「上一步操作」自动决定：空闲=本卷纪年，点人名=人物，检索=结果。顶部常驻一条精简的当前年条（点它即返回完整纪年），纪年永远一眼可见；一个明确的「← 返回纪年」回到空闲。无标签、无手动切换。人物与检索的出处，统一复用现有检索结果样式——按年分组的片段卡（高亮命中、胡注前缀、本卷 ▲▼ 逐处导航），不再各画一套。",
      jinian:"顶部常驻精简年条（可点→完整纪年）；完整年表在空闲态主体",
      ps:"人物 / 检索 自动切换主体；共用同一套「检索结果」片段卡列表",
      risk:"检索会顶替正在看的人物卡。靠显式上下文标题 + 返回 + 记住上一个人物缓解。"},
    stack:{name:"B · 堆叠滚动 Stacked Scroll",rec:false,
      thesis:"右坞是一条按固定优先级排好的纵向滚动：置顶当前年条 → 检索框 → 人物卡（仅激活时出现）→ 统一出处列表 → 本卷纪年全表。什么都不藏、什么都不变形；点人名/检索时自动滚动锚定到相关段，省得你找。",
      jinian:"置顶 sticky 当前年条常驻；全表在底部（限高）",
      ps:"人物卡只显身份；下方统一出处列表按来源（人物/检索）填充，不重复",
      risk:"仍可能「侧栏太满」。靠 顶N+更多 折叠 + 自动锚定缓解。"},
    spot:{name:"C · 聚光 + 速览 Spotlight & Peek",rec:false,
      thesis:"主区聚光一件当前上下文；其余工具留作纤细的「速览行」——显示实时摘要（当前年 / 查询N处 / 人物名·出现N），可一眼看、点进去即聚光。速览行是折叠的内容、不是标签：满宽、带活数据、就地展开。",
      jinian:"未聚光时为速览行（显示当前年）；点进即聚光为全表",
      ps:"人物 / 检索 聚光，共用同一出处芯片列表；另一者留作速览行",
      risk:"速览行可能被误认成标签。靠 实时摘要 + 满宽内容行 + 不等高 区分。"},
  };

  const P={name:"王翦",src:"来自正文",brief:"秦名将，频阳东乡人。",dynasty:"秦",conf:"身份已复核",
    aliases:["王将军","频阳王氏"],priorLabel:"卷007 · 前226年 · 不含当前段",
    prior:[{y:"前236",s:"原文"},{y:"前229",s:"原文"},{y:"前228",s:"胡注",hu:1},{y:"前227",s:"原文"}],
    fcount:9,identity:"秦灭六国第一名将，破赵、平燕、以六十万灭楚。频阳东乡人。",
    future:[{y:"前225",s:"原文"},{y:"前224",s:"原文"},{y:"前223",s:"胡注",hu:1}]};
  const YEARS=[{y:"前236",t:"伐赵"},{y:"前230",t:"灭韩"},{y:"前228",t:"破赵"},{y:"前226",t:"议伐楚",cur:1},{y:"前225",t:"灌大梁"},{y:"前223",t:"灭楚"}];

  const chip=a=>`<button class="jchip" data-jump="${a.y}"><span class="y">${a.y}</span><span class="s${a.hu?' hu':''}">${a.s}</span><span class="a">→</span></button>`;
  const occChips=arr=>`<div class="chips" data-chips>${arr.map(chip).join("")}</div>`;
  const para=()=>`<p class="para">王贲攻楚，取十馀城。王使<button class="pname" data-x>李信</button>问于<button class="pname pw">王翦</button>曰：「吾欲取荆，于将军度用几何人而足？」<button class="pname" data-x>李信</button>曰：「不过用二十万。」王以问<button class="pname pw">王翦</button>，<button class="pname pw">王翦</button>曰：「非六十万人不可。」</p>`;
  const para2=()=>`<p class="para">始皇曰：「王将军老矣，何怯也！」遂使<button class="pname" data-x>李信</button>、<button class="pname" data-x>蒙恬</button>将二十万南伐荆。<button class="pname pw">王翦</button>言不用，因谢病，归老于频阳。</p>`;
  const readerInner=()=>`<div class="reader-inner"><h2>卷007 · 秦纪二</h2><div class="sub">始皇帝下 · 前226年</div>${para()}${para2()}</div>`;
  const yearStrip=()=>`<div class="yr-strip"><div class="lead">本卷纪年 · <span class="y">前226年</span> <span class="lbl">议伐楚</span></div></div>`;
  const yearsFull=()=>`<div class="sec">${YEARS.map(y=>`<div class="yrow ${y.cur?'cur':''}" data-jump="${y.y}"><b>${y.y}</b> ${y.t}${y.cur?' · 当前':''}</div>`).join("")}</div>`;
  const searchView=q=>`<div class="sec"><input class="sinput" value="${q||'王翦'}" /><div class="filt"><input type="checkbox" checked />仅显示当前卷之前</div></div><div class="sec"><div class="panel-title">“${q||'王翦'}” · 4 段 / 6 处</div>${occChips(P.prior)}</div>`;
  const personIdentity=()=>`<div class="mast"><h4>${P.name}</h4><span class="src">${P.src}</span><button class="x" data-close>×</button></div><p class="brief">${P.brief}</p><div class="meta"><span class="c">${P.dynasty}</span><span class="c cf">${P.conf} ⓘ</span></div><p class="brief" style="color:var(--muted);font-size:.72rem">别称　${P.aliases.join(" · ")}</p>`;
  const personFull=()=>`<div class="sec">${personIdentity()}<div class="tlh" title="${P.priorLabel}">🔒 此前出现 <b>${P.prior.length}</b> 段 · 读到本段前</div>${occChips(P.prior)}<div data-revzone><button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button></div></div>`;
  const revealHTML=()=>`<div class="future"><h5>此后出现（含剧透）· ${P.fcount} 段　<button class="reveal" data-hide style="display:inline;width:auto;padding:.1em .5em;margin:0;border-style:solid">收起</button></h5><p class="brief">${P.identity}</p>${occChips(P.future)}</div>`;

  // ---- real search-result styled occurrence data (snippets w/ marks) ----
  const OCC_PRIOR=[
    {y:"前236",hu:false,snip:"王翦将上地，下井陉，破赵军",pre:false,post:true},
    {y:"前229",hu:false,snip:"秦使王翦攻赵，赵使李牧拒之",pre:false,post:true},
    {y:"前228",hu:true ,snip:"王翦，频阳东乡人也",pre:false,post:false},
    {y:"前227",hu:false,snip:"王翦言不用，谢病归频阳",pre:false,post:true},
  ];
  const OCC_FUTURE=[
    {y:"前225",hu:false,snip:"王翦请六十万人以伐荆",pre:true ,post:true},
    {y:"前224",hu:false,snip:"王翦坚壁不与战，楚人挑之",pre:false,post:true},
    {y:"前223",hu:true ,snip:"王翦遂定荆地为郡县",pre:false,post:false},
  ];
  const markName=s=>s.split("王翦").join('<mark>王翦</mark>');
  const snipCard=o=>`<li class="lookup-hit"><button class="lookup-jump" data-jump="${o.y}"><span class="lookup-snippet${o.hu?' in-hu':''}">${o.pre?'':'…'}${markName(o.snip)}${o.post?'':'…'}</span></button></li>`;
  const navPill=n=>`<span class="hit-nav"><button class="hit-nav-btn" data-nav title="上一处">▲</button><span class="hit-nav-count">1<span class="hit-nav-sep">/</span>${n}</span><button class="hit-nav-btn" data-nav title="下一处">▼</button></span>`;
  function lookupList(occs,opt={}){
    const groups=occs.map(o=>`<div class="lookup-year-group"><div class="lookup-year-header">${o.y}年</div><ol class="lookup-list">${snipCard(o)}</ol></div>`).join("");
    return `<section class="lookup-juan-group is-current${opt.future?' is-future':''}"><header class="lookup-juan-header"><span class="lookup-juan-label">卷007</span>${opt.nav?navPill(occs.length):''}<span class="lookup-juan-count">${occs.length}段</span></header>${groups}</section>`;
  }
  // A 专用：去掉迷你时间轴，年条改为可点（→ 返回完整纪年）
  const yearStripA=()=>`<button class="yr-strip yr-strip-btn" data-toidle><span class="lead">本卷纪年 · <span class="y">前226年</span> <span class="lbl">议伐楚</span></span><span class="strip-arrow">全部 ›</span></button>`;
  const personViewA=()=>`<div class="sec">${personIdentity()}<div class="tlh" title="${P.priorLabel}">🔒 读到本段前 · 此前 <b>${OCC_PRIOR.length}</b> 处</div></div><div class="sec">${lookupList(OCC_PRIOR,{nav:true})}</div><div class="sec" data-revzone><button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button></div>`;
  const searchViewA=q=>`<div class="sec"><input class="sinput" value="${q||'王翦'}" /><label class="filt"><input type="checkbox" checked />仅显示本卷之前</label></div><div class="sec"><p class="lookup-summary" style="margin:.1rem 0 .45rem;font-size:.8rem;color:var(--muted)">“<b style="color:var(--ink)">${q||'王翦'}</b>” 共 <b style="color:var(--ink)">${OCC_PRIOR.length}</b> 段（6 处匹配）<b style="color:var(--ink)">（此后另有 ${P.fcount} 处已隐藏）</b></p>${lookupList(OCC_PRIOR,{nav:true})}</div>`;
  const futureBlock=()=>`<div class="future"><h5>此后出现（含剧透）· ${P.fcount} 段　<button class="reveal" data-hide style="display:inline;width:auto;padding:.1em .5em;margin:0;border-style:solid">收起</button></h5><p class="brief">${P.identity}</p>${lookupList(OCC_FUTURE,{future:true})}</div>`;
  function wireSwapBody(scope){
    scope.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>toast("跳至 "+el.dataset.jump+" 年 · 此段")));
    scope.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>toast("逐处跳转（本卷）")));
    scope.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>goIdle()));
    const rev=scope.querySelector("[data-reveal]");
    if(rev)rev.addEventListener("click",()=>{const z=scope.querySelector("[data-revzone]");z.innerHTML=futureBlock();wireSwapBody(scope);});
    const hide=scope.querySelector("[data-hide]");
    if(hide)hide.addEventListener("click",()=>{const z=scope.querySelector("[data-revzone]");z.innerHTML=`<button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button>`;wireSwapBody(scope);});
  }

  let curV="swap",curView="desktop",personSeen=false;
  const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1100);};

  function renderSpec(){const d=SPEC[curV];document.getElementById("spec").innerHTML=`<div class="spec-name">${d.name}${d.rec?'<span class="spec-badge">● 推荐起点</span>':''}</div><p class="spec-thesis">${d.thesis}</p><div class="spec-grid"><div class="spec-cell"><div class="k">本卷纪年 去哪</div><div class="v">${d.jinian}</div></div><div class="spec-cell"><div class="k">人物 + 检索</div><div class="v">${d.ps}</div></div><div class="spec-cell risk"><div class="k">最大风险</div><div class="v">${d.risk}</div></div></div>`;}

  function fillRail(rail){ if(!rail)return; rail.innerHTML="";YEARS.forEach((y,i)=>{const pct=(i/(YEARS.length-1))*100;const t=document.createElement("div");t.className="t";t.style.left=pct+"%";t.dataset.jump=y.y;rail.appendChild(t);});const cur=YEARS.findIndex(y=>y.cur);const b=document.createElement("div");b.className="b";b.style.left=(cur/(YEARS.length-1))*100+"%";rail.appendChild(b);}

  // ---------- desktop dock per variant ----------
  function dockHTML(){
    if(curV==="swap") return `${yearStripA()}<div class="ctx-head" data-ctx hidden></div><div class="dock-body" data-body>${yearsFull()}</div>`;
    if(curV==="stack") return `${yearStrip()}<div class="dock-body"><div class="sec"><div class="panel-title">出处检索 ⌕</div><input class="sinput" placeholder="选中正文或输入" /></div><div data-personsec hidden></div><div class="sec" data-occ><div class="empty">点正文人名看其出现，或在上方检索。</div></div><div class="sec"><div class="panel-title">本卷纪年</div>${YEARS.map(y=>`<div class="yrow ${y.cur?'cur':''}" data-jump="${y.y}"><b>${y.y}</b> ${y.t}</div>`).join("")}</div></div>`;
    // spotlight
    return `<div class="spotlight" data-spot>${yearsFull()}</div><div class="peeks" data-peeks></div>`;
  }

  function buildDesktop(){
    const f=document.createElement("div");f.className="device-desktop";
    f.innerHTML=`<div class="chrome"><i></i><i></i><i></i></div><div class="screen"><div class="app"><header class="hdr"><span class="ico" title="目录">▤</span><span class="ttl">卷007 秦纪二</span><span class="grow"></span><span class="ico" data-search title="检索">⌕</span><span class="ico" title="设置">⚙</span></header><div class="reader">${readerInner()}</div><aside class="dock" data-dock>${dockHTML()}</aside></div></div>`;
    return f;
  }

  // ---------- behaviors ----------
  function wireOcc(scope){
    scope.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>{toast("跳至 "+el.dataset.jump+" 年 · 此段");}));
    const rev=scope.querySelector("[data-reveal]");
    if(rev)rev.addEventListener("click",()=>{const z=scope.querySelector("[data-revzone]");z.innerHTML=revealHTML();wireOcc(scope);const h=z.querySelector("[data-hide]");if(h)h.addEventListener("click",()=>{z.innerHTML=`<button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button>`;wireOcc(scope);});});
    scope.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>goIdle()));
  }

  function dock(){return document.querySelector("[data-dock]");}

  // SWAP
  function swapTo(state,q){
    const d=dock();const ctx=d.querySelector("[data-ctx]");const body=d.querySelector("[data-body]");
    body.classList.remove("swap-in");void body.offsetWidth;body.classList.add("swap-in");
    if(state==="idle"){ctx.hidden=true;ctx.innerHTML="";body.innerHTML=yearsFull();}
    else if(state==="person"){ctx.hidden=false;ctx.innerHTML=`<span class="t">人物 · <small>王翦</small></span><span class="grow"></span><button class="back" data-back>← 返回纪年</button>`;body.innerHTML=personViewA();}
    else{ctx.hidden=false;ctx.innerHTML=`<span class="t">出处检索 · <small>“${q||'王翦'}”</small></span><span class="grow"></span><button class="back" data-back>×</button>`;body.innerHTML=searchViewA(q);}
    const bk=ctx.querySelector("[data-back]");if(bk)bk.addEventListener("click",()=>goIdle());
    wireSwapBody(body);
  }

  // STACK
  function stackPerson(){
    const d=dock();const ps=d.querySelector("[data-personsec]");ps.hidden=false;ps.innerHTML=personFull();
    const occ=d.querySelector("[data-occ]");occ.innerHTML=`<div class="panel-title">出现位置 · 出处</div>${occChips(P.prior)}`;
    ps.classList.add("swap-in");wireOcc(ps);wireOcc(occ);
    ps.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function stackSearch(q){
    const d=dock();const occ=d.querySelector("[data-occ]");occ.innerHTML=`<div class="panel-title">“${q||'王翦'}” · 4 段 / 6 处</div>${occChips(P.prior)}`;wireOcc(occ);occ.scrollIntoView({behavior:"smooth",block:"start"});
  }

  // SPOTLIGHT
  function spotlight(state){
    const d=dock();const spot=d.querySelector("[data-spot]");const peeks=d.querySelector("[data-peeks]");
    spot.classList.remove("swap-in");void spot.offsetWidth;spot.classList.add("swap-in");
    const peekDefs={
      years:{t:"本卷纪年",s:"前226年 · 议伐楚"},
      search:{t:"出处检索 ⌕",s:"选中文本或输入"},
      person:{t:"王翦 · 人物",s:"此前 4 处 · 后文 9 处已藏"},
    };
    if(state==="years")spot.innerHTML=yearsFull();
    else if(state==="person")spot.innerHTML=personFull();
    else spot.innerHTML=searchView();
    const order=["years","search","person"].filter(k=>k!==state&&(k!=="person"||personSeen));
    peeks.innerHTML=order.map(k=>`<button class="peek" data-peek="${k}"><span class="pk-t">${peekDefs[k].t}</span><span class="pk-s">${peekDefs[k].s}</span></button>`).join("");
    peeks.querySelectorAll("[data-peek]").forEach(b=>b.addEventListener("click",()=>spotlight(b.dataset.peek)));
    wireOcc(spot);spot.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>toast("跳至 "+el.dataset.jump+" 年")));
  }

  function goIdle(){
    document.querySelectorAll(".pname.on").forEach(n=>n.classList.remove("on"));
    if(curV==="swap")swapTo("idle");
    else if(curV==="stack"){const d=dock();const ps=d.querySelector("[data-personsec]");ps.hidden=true;ps.innerHTML="";d.querySelector("[data-occ]").innerHTML=`<div class="empty">点正文人名看其出现，或在上方检索。</div>`;}
    else spotlight("years");
  }
  function onPerson(btn){
    document.querySelectorAll(".pname.on").forEach(n=>n.classList.remove("on"));btn.classList.add("on");personSeen=true;
    if(curV==="swap")swapTo("person");
    else if(curV==="stack")stackPerson();
    else spotlight("person");
  }
  function onSearch(){
    if(curV==="swap")swapTo("search");
    else if(curV==="stack")stackSearch();
    else{personSeen=personSeen;spotlight("search");}
  }

  function wireStage(){
    const app=document.querySelector(".app");if(!app)return;
    app.querySelectorAll(".pname.pw").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();onPerson(b);}));
    app.querySelectorAll(".pname[data-x]").forEach(b=>b.addEventListener("click",()=>toast("示例仅「王翦」可点")));
    app.querySelectorAll("[data-search]").forEach(b=>b.addEventListener("click",()=>onSearch()));
    const d=dock();
    d.querySelectorAll("[data-rail]").forEach(fillRail);
    d.querySelectorAll("[data-toidle]").forEach(b=>b.addEventListener("click",()=>{if(curV==="swap")goIdle();}));
    d.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>toast("跳至 "+el.dataset.jump+" 年")));
    if(curV==="spot")spotlight("years");
    if(curV==="stack")d.querySelectorAll("[data-occ]").forEach(o=>wireOcc(o));
  }

  // ---------- phone ----------
  function buildPhone(){
    const f=document.createElement("div");f.className="device-phone";
    let sheet="";
    if(curV==="swap")sheet=`<div class="ph-sheet"><div class="ph-grip"></div><div class="ctx-head"><span class="t">人物 · <small>王翦</small></span><span class="grow"></span><button class="back" data-back>← 返回纪年</button></div><div class="ph-sheet-body"><div class="sec">${personIdentity()}<div class="tlh">🔒 读到本段前 · 此前 <b>4</b> 处</div></div><div class="sec">${lookupList(OCC_PRIOR,{nav:true})}</div><div class="sec" data-revzone><button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button></div></div></div>`;
    else if(curV==="stack")sheet=`<div class="ph-sheet"><div class="ph-grip"></div>${yearStrip()}<div class="ph-sheet-body"><div class="sec">${personIdentity()}</div><div class="sec"><div class="panel-title">出现位置</div>${occChips(P.prior)}</div></div></div>`;
    else sheet=`<div class="ph-sheet"><div class="ph-grip"></div><div class="spotlight" style="flex:none;max-height:42vh">${personFull()}</div><div class="peeks"><button class="peek"><span class="pk-t">本卷纪年</span><span class="pk-s">前226年 · 议伐楚</span></button><button class="peek"><span class="pk-t">出处检索 ⌕</span><span class="pk-s">选中文本或输入</span></button></div></div>`;
    f.innerHTML=`<div class="screen"><div class="ph"><div class="ph-hdr"><span class="ico">▤</span><span class="ttl">卷007 秦纪二</span><span class="pill">前226</span><span class="ico">⚙</span></div><div class="ph-rd">${para()}${para2()}</div>${sheet}</div></div>`;
    return f;
  }

  function render(){
    const stage=document.getElementById("stage");stage.innerHTML="";personSeen=false;
    stage.appendChild(curView==="desktop"?buildDesktop():buildPhone());
    renderSpec();
    if(curView==="desktop")wireStage();
    else{document.querySelectorAll("#stage [data-jump]").forEach(el=>el.addEventListener("click",()=>toast("跳至 "+el.dataset.jump+" 年")));document.querySelectorAll("#stage [data-reveal]").forEach(r=>r.addEventListener("click",()=>{const z=r.closest("[data-revzone]");if(!z)return;z.innerHTML=(curV==="swap")?futureBlock():revealHTML();z.querySelectorAll("[data-jump]").forEach(el=>el.addEventListener("click",()=>toast("跳至 "+el.dataset.jump+" 年")));const h=z.querySelector("[data-hide]");if(h)h.addEventListener("click",()=>{z.innerHTML=`<button class="reveal" data-reveal>显示后文（含剧透 · ${P.fcount} 处） ▾</button>`;render();});}));document.querySelectorAll("#stage [data-back]").forEach(b=>b.addEventListener("click",()=>toast("返回纪年")));}
  }

  document.getElementById("vtabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;curV=b.dataset.v;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render();});
  document.getElementById("viewToggle").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;curView=b.dataset.view;[...e.currentTarget.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render();});

  document.querySelector('#vtabs [data-v="swap"]').setAttribute("aria-pressed","true");
  render();
</script>
</body>
</html>
