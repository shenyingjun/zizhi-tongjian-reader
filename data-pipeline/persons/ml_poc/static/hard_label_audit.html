<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>困难跨度盲审</title>
  <style>
    body { font: 16px/1.6 system-ui,sans-serif; margin: 0 auto; max-width: 980px; padding: 20px; color: #24292f; }
    header { position: sticky; top: 0; z-index: 2; background: white; padding: 10px 0; border-bottom: 1px solid #d0d7de; }
    .jie { border-bottom: 4px solid #d8dee4; margin: 30px 0; padding-bottom: 24px; }
    .paragraph { background: #f6f8fa; margin: 8px 0; padding: 9px; }
    .candidate { border: 1px solid #d0d7de; border-radius: 8px; margin: 14px 0; padding: 12px; }
    .candidate.active { border-color: #0969da; box-shadow: 0 0 0 2px #ddf4ff; }
    .candidate.done { opacity: .55; }
    mark { background: #fff1a8; font-weight: 700; }
    button { font: inherit; margin: 5px; padding: 7px 11px; cursor: pointer; }
    .error { color: #cf222e; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <strong>困难跨度盲审</strong>
    <span id="progress"></span>
    <div>快捷键：E 精确人名 · W 边界错误 · N 非人名 · U 不确定</div>
    <div id="status"></div>
  </header>
  <main id="tasks"></main>
  <script src="/hard_label_audit.js"></script>
</body>
</html>
